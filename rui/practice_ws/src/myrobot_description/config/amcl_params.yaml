# AMCL localization parameters for the provided Gazebo map and planar-drive robot.
# Coordinates match the Gazebo/world frame used by maps/raicom_known_map.yaml.
min_particles: 300
max_particles: 2000
kld_err: 0.02
kld_z: 0.99
update_min_d: 0.03
update_min_a: 0.05
resample_interval: 1
transform_tolerance: 0.5
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.1

odom_model_type: omni
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.08
odom_alpha4: 0.05
odom_alpha5: 0.08
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map

laser_min_range: 0.12
laser_max_range: 8.0
laser_max_beams: 60
laser_z_hit: 0.95
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.12
laser_lambda_short: 0.1
laser_likelihood_max_dist: 2.0
laser_model_type: likelihood_field

initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: -1.5708
initial_cov_xx: 0.02
initial_cov_yy: 0.02
initial_cov_aa: 0.04
