# Parameters for ROS1 gmapping on the unchanged RAICOM/Gazebo world.
# Frames are also set in launch/slam_mapping.launch; values here keep the file self-documenting.
base_frame: base_footprint
odom_frame: odom
map_frame: map

# The simulated laser in turtlebot3_mecanum.urdf.xacro publishes /scan with 360 samples.
throttle_scans: 1
map_update_interval: 1.0
maxUrange: 8.0
maxRange: 12.0

# Scan matching. Conservative values for a small 5 m x 4 m indoor map.
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
lskip: 0
minimumScore: 30

# Motion model noise. Keep enough freedom for scan matching to correct the
# small physical drift introduced by Gazebo contacts and in-place rotations.
srr: 0.05
srt: 0.05
str: 0.05
stt: 0.05

# Map update thresholds. Low thresholds make the map update frequently during slow autonomous patrol.
linearUpdate: 0.10
angularUpdate: 0.10
temporalUpdate: 0.5
resampleThreshold: 0.5
particles: 30

# Map bounds, meters. Covers the whole 5 m x 4 m arena plus margin.
xmin: -1.0
ymin: -4.5
xmax: 6.0
ymax: 1.0
delta: 0.03

# Likelihood-field sampling parameters.
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005

# TF publication.
transform_publish_period: 0.05
occ_thresh: 0.25
