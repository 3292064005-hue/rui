# Local planning follows the global static-map route. The obstacle layer is kept
# subscribed for visualization/clearing, but it does not mark laser points into
# the rolling local costmap. In this static Gazebo task, letting TEB collide
# against dense laser cells near narrow map walls causes repeated false
# "trajectory is not feasible" warnings.
footprint: [[0.10, 0.09], [0.10, -0.09], [-0.10, -0.09], [-0.10, 0.09]]
footprint_padding: 0.00

obstacle_range: 2.8
raytrace_range: 3.2
transform_tolerance: 0.5

inflation_radius: 0.40
cost_scaling_factor: 3.0

plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: base_scan
    data_type: LaserScan
    topic: /scan_filtered
    marking: false
    clearing: true
    expected_update_rate: 0.0
    inf_is_valid: true
