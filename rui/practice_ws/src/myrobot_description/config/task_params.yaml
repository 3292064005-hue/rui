# Task parameters for the 5 m x 4 m RAICOM scouting map.
# The default world now contains visual-only image panels for the recognition task.

model_name: mycar
cmd_vel_topic: /cmd_vel
odom_topic: /odom
patrol_status_topic: /patrol_status
control_rate: 20.0
odom_timeout: 8.0

# Holonomic/mecanum patrol controller parameters.
goal_tolerance: 0.08
yaw_tolerance: 0.20
position_gain: 1.20
yaw_gain: 1.80
max_linear_speed: 0.30
max_lateral_speed: 0.24
max_angular_speed: 1.00
face_path: false
loop: false
stop_at_end: true

# Legacy simple-controller route. The normal task uses navigation_goals from
# navigation_params.yaml; this copy keeps task_patrol_simple.launch usable.
waypoints:
  - {name: left_wall_exit,     x: 0.00, y: -3.50, yaw: -1.5708, hold: 0.1}
  - {name: zone_1_entry,       x: 0.52, y: -3.50, yaw:  0.0000, hold: 0.1}
  - {name: zone_1,             x: 0.52, y: -2.55, yaw:  0.0000, hold: 1.5}
  - {name: left_top_out,       x: 0.52, y: -0.58, yaw:  0.0000, hold: 0.1}
  - {name: top_middle,         x: 3.00, y: -0.58, yaw: -1.5708, hold: 0.1}
  - {name: right_wall_exit,    x: 3.00, y: -2.00, yaw: -3.1416, hold: 0.1}
  - {name: right_middle,       x: 2.00, y: -2.00, yaw: -1.5708, hold: 0.1}
  - {name: right_wall_return,  x: 2.00, y: -3.50, yaw:  0.0000, hold: 0.1}
  - {name: bottom_right,       x: 4.45, y: -3.50, yaw:  1.5708, hold: 0.1}
  - {name: zone_2,             x: 4.45, y: -1.65, yaw:  3.1416, hold: 1.5}
  - {name: right_top_out,      x: 4.45, y: -0.08, yaw:  3.1416, hold: 0.1}
  - {name: top_return,         x: 2.20, y: -0.08, yaw:  3.1416, hold: 0.1}
  - {name: finish,             x: 0.30, y: -0.08, yaw:  3.1416, hold: 0.1}

# Recognition-zone trigger and expected values.
# The recognizer now counts the target cards from /camera/image_raw. enemy / friendly / hostage
# remain as acceptance baselines so the published JSON can include the expected counts.
zones:
  - name: zone_1
    center_x: 0.52
    center_y: -2.55
    radius: 0.35
    enemy: 1
    friendly: 1
    hostage: 0
  - name: zone_2
    center_x: 4.45
    center_y: -1.65
    radius: 0.35
    enemy: 2
    friendly: 0
    hostage: 1

recognition_topic: /recognition_result
recognition_summary_topic: /recognition_summary
report_once: true
use_camera_image_detection: true
image_topic: /camera/image_raw
template_dir: ""
image_timeout: 1.5
camera_crop: [0.02, 0.98, 0.00, 0.78]
min_card_area_px: 900
orb_match_threshold: 12
template_match_threshold: 0.68
recognition_capture_delay: 0.45
allow_expected_count_fallback: false

# Optional soldier-image model interface.
# auto: use recognition_weights when a valid ONNX file exists, otherwise use templates.
# template: always use ORB/template matching.
# onnx: require a valid ONNX classifier and fail fast when it cannot be loaded.
recognition_backend: auto
recognition_weights: ""
recognition_model_labels: [enemy, friendly, hostage]
recognition_model_input_size: [224, 224]
recognition_model_scale: 0.003921568627
recognition_model_mean: [0.0, 0.0, 0.0]
recognition_model_swap_rb: true
recognition_model_confidence: 0.60

# Evidence recorder / RViz overlay settings.
# Log files are written outside the package so catkin clean will not delete them.
log_dir: ~/.ros/myrobot_description_logs
task_marker_topic: /task_markers
trajectory_topic: /task_trajectory
visualization_frame: odom
trajectory_sample_period: 0.20
publish_task_markers: true
