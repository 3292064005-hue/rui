DWAPlannerROS:
  holonomic_robot: true

  max_vel_trans: 0.95
  min_vel_trans: 0.06
  max_vel_x: 0.95
  min_vel_x: -0.65
  max_vel_y: 0.75
  min_vel_y: -0.75
  max_vel_theta: 1.45
  min_vel_theta: 0.10

  acc_lim_trans: 3.6
  acc_lim_x: 3.6
  acc_lim_y: 3.2
  acc_lim_theta: 4.2

  xy_goal_tolerance: 0.05
  # Heading is controlled by cmd_vel_target_yaw_filter for this holonomic base.
  # Keep DWA focused on xy so it does not get stuck in stop-rotate at the goal.
  yaw_goal_tolerance: 3.14
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.04
  theta_stopped_vel: 0.08

  sim_time: 1.4
  sim_granularity: 0.020
  angular_sim_granularity: 0.05
  vx_samples: 16
  vy_samples: 11
  vth_samples: 32
  use_dwa: true

  path_distance_bias: 80.0
  goal_distance_bias: 0
  occdist_scale: 1.0
  twirling_scale: 0.04
  forward_point_distance: 0.05
  stop_time_buffer: 0.15

  oscillation_reset_dist: 0.08
  oscillation_reset_angle: 0.20
  prune_plan: true
