# Autonomous map-based navigation parameters.
# Frame coordinates use the saved SLAM map frame of maps/raicom_slam_map_01.yaml.
move_base_action: /move_base
navigation_status_topic: /navigation_status
patrol_status_topic: /navigation_status
navigation_target_yaw_topic: /navigation_target_yaw
navigation_goal_frame: map
navigation_goal_timeout: 180.0
navigation_server_timeout: 30.0
navigation_startup_stabilization_delay: 2.0
navigation_retry_count: 1
navigation_clear_costmaps_on_retry: true
navigation_stop_on_failure: false
navigation_hold_at_goal: 0.8
navigation_base_frame: base_footprint
# Formal navigation lets move_base/TEB publish /cmd_vel directly. No extra
# target-yaw or path-velocity filter is inserted in the command stream.
navigation_control_frame: map
navigation_separate_rotation: false
navigation_rotation_rate: 20.0
navigation_rotation_gain: 1.00
navigation_rotation_max_speed: 0.65
navigation_rotation_min_speed: 0.08
navigation_rotation_tolerance: 0.08
navigation_rotation_timeout: 20.0
navigation_teb_angular_keep_ratio: 0.35
navigation_teb_angular_blend_error: 0.45
navigation_min_yaw_control_scale: 0.20
navigation_full_yaw_control_distance: 0.80
navigation_cmd_vel_target_yaw_filter: false
navigation_path_velocity_filter: false
navigation_global_plan_topic: /move_base/GlobalPlanner/plan
navigation_path_refresh_from_make_plan: false
navigation_path_refresh_interval: 0.5
navigation_path_alignment_gain: 0.92
navigation_path_lateral_gain: 0.45
navigation_path_max_lateral_speed_ratio: 0.12
navigation_path_min_projected_speed: 0.05
navigation_path_max_age: 2.0
navigation_skip_reached_goal_distance: 0.22
navigation_stop_duration: 0.20
navigation_use_holonomic_path_follower: false
navigation_use_plan_subgoals: false
navigation_plan_subgoal_spacing: 0.60
navigation_plan_subgoal_timeout: 45.0
navigation_plan_subgoal_tolerance: 0.16
navigation_use_internal_route: true
navigation_internal_goal_timeout: 45.0
navigation_internal_route_tolerance: 0.08
navigation_internal_route_strict: true
# slam_mapping.launch overrides this to true so the same points can be driven
# before a static map and move_base planning service exist.
navigation_use_direct_path: false
navigation_make_plan_service: /move_base/make_plan
navigation_translation_rate: 20.0
navigation_translation_tolerance: 0.04
navigation_arrival_stable_cycles: 4
navigation_translation_gain: 3.40
navigation_translation_max_forward_speed: 0.55
navigation_translation_max_lateral_speed: 0.55
navigation_path_lookahead: 0.30
navigation_replan_interval: 1.0
navigation_stuck_timeout: 8.0
navigation_progress_distance: 0.01
navigation_fast_direct_speed: 1.0
navigation_fast_direct_min_speed: 0.20
navigation_fast_direct_accel: 0.90
navigation_fast_direct_decel: 1.60
navigation_fast_direct_lateral_gain: 0.45
navigation_fast_direct_max_lateral_speed: 0.05
navigation_fast_direct_yaw_gain: 0.65
navigation_fast_direct_yaw_tolerance: 0.10
navigation_fast_direct_locked_yaw: 3.1416
navigation_fast_direct_center_y: 0.00
navigation_fast_direct_timeout: 10.0

# Formal patrol goals. Visit both recognition zones before returning to finish.
# Long legs are still expanded through fixed internal route points below.
navigation_goals:
  - {name: zone_1, x: 0.52, y: -2.55, yaw: 0.0000, hold: 1.5, rotate_at_goal: true, strict_xy_tolerance: true, xy_tolerance: 0.08}
  - {name: right_wall_exit, x: 3.00, y: -2.00, yaw: -3.1416, hold: 0.1}
  - {name: zone_2, x: 4.45, y: -1.65, yaw: 3.1416, hold: 1.5, rotate_at_goal: true, strict_xy_tolerance: true, xy_tolerance: 0.08}
  - {name: finish, x: 0.25, y: 0.00, yaw: 3.1416, hold: 0.1, strict_xy_tolerance: false, xy_tolerance: 0.18, fast_direct: true}
navigation_internal_route:
  zone_1:
    - {name: left_wall_exit, x: 0.52, y: -3.50, yaw: -1.5708}
    - {name: zone_1_entry, x: 0.52, y: -3.18, yaw: -1.5708}
  right_wall_exit:
    - {name: left_top_out, x: 0.62, y: -0.43, yaw: 0.0000}
    - {name: top_middle, x: 3.00, y: -0.58, yaw: -1.5708}
  zone_2:
    - {name: right_middle, x: 2.05, y: -2.00, yaw: -1.5708}
    - {name: right_gap_upper, x: 2.05, y: -2.48, yaw: -1.5708}
    - {name: right_gap_lower, x: 2.05, y: -3.26, yaw: -1.5708}
    - {name: bottom_lane, x: 2.48, y: -3.45, yaw: 0.0000}
    - {name: bottom_right, x: 4.48, y: -3.45, yaw: 1.5708}
  finish:
    - {name: right_top_out, x: 4.38, y: 0.10, yaw: 3.1416, rotate_at_goal: true, strict_xy_tolerance: true, xy_tolerance: 0.08}
    - {name: top_return, x: 2.20, y: 0.00, yaw: 3.1416}
    - {name: finish_entry, x: 0.60, y: 0.00, yaw: 3.1416}
