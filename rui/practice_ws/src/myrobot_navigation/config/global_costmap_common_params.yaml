# Global planning should stay on the static map. Feeding live laser obstacle
# points into the global map can temporarily seal narrow corridors and make
# GlobalPlanner report NO PATH even when the static map has a valid route.
footprint: [[0.10, 0.09], [0.10, -0.09], [-0.10, -0.09], [-0.10, 0.09]]
footprint_padding: 0.00

transform_tolerance: 0.5
# Keep a light buffer from walls without making narrow corridors look blocked.
inflation_radius: 0.22
cost_scaling_factor: 4.0

plugins:
  - {name: static_layer, type: "costmap_2d::StaticLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
