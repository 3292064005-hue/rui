# Keep the local map lightweight. Static walls are handled by the global map.
# Filtered laser points only clear transient speckles; TEB does not consume
# local costmap obstacles during formal patrol because sparse wall returns make
# it overreact and generate loops in narrow corridors.
footprint: [[0.11, 0.10], [0.11, -0.10], [-0.11, -0.10], [-0.11, 0.10]]
footprint_padding: 0.01

obstacle_range: 0.85
raytrace_range: 1.3
transform_tolerance: 0.5

inflation_radius: 0.21
cost_scaling_factor: 2.8

plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: base_scan
    data_type: LaserScan
    topic: /scan_filtered
    marking: false
    clearing: true
    expected_update_rate: 0.0
    inf_is_valid: true
