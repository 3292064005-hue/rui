# Local planning uses live laser data for short-horizon collision avoidance.
footprint: [[0.12, 0.105], [0.12, -0.105], [-0.12, -0.105], [-0.12, 0.105]]
footprint_padding: 0.01

obstacle_range: 2.8
raytrace_range: 3.2
transform_tolerance: 0.5

inflation_radius: 0.23
cost_scaling_factor: 4.0

plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: base_scan
    data_type: LaserScan
    topic: /scan_filtered
    marking: true
    clearing: true
    expected_update_rate: 0.0
    inf_is_valid: true
