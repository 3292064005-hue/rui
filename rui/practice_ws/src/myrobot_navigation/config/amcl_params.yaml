# AMCL localization parameters for the provided Gazebo map and planar-drive robot.
# Coordinates match the Gazebo/world frame used by maps/raicom_slam_map_one_lap_test.yaml.
min_particles: 80
max_particles: 600
kld_err: 0.01
kld_z: 0.99
update_min_d: 0.03
update_min_a: 0.05
resample_interval: 1
transform_tolerance: 0.5
# The robot always starts from a known pose in this Gazebo task. Disable random
# recovery particle injection so AMCL does not spread a large red cloud near
# corners/finish and perturb move_base with noisy pose estimates.
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0

odom_model_type: omni
odom_alpha1: 0.01
odom_alpha2: 0.01
odom_alpha3: 0.02
odom_alpha4: 0.01
odom_alpha5: 0.02
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map

laser_min_range: 0.12
laser_max_range: 8.0
laser_max_beams: 90
laser_z_hit: 0.95
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.08
laser_lambda_short: 0.1
laser_likelihood_max_dist: 2.0
laser_model_type: likelihood_field

initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: -1.5708
initial_cov_xx: 0.004
initial_cov_yy: 0.004
initial_cov_aa: 0.01
