# Parameters for ROS1 gmapping on the unchanged RAICOM/Gazebo world.
# Frames are also set in launch/slam_mapping.launch; values here keep the file self-documenting.
base_frame: base_footprint
odom_frame: odom
map_frame: map

# The simulated laser publishes 720 samples at 10 Hz. Limit matching to the
# useful arena range so distant max-range returns do not dominate the score.
throttle_scans: 1
map_update_interval: 0.4
maxUrange: 4.2
maxRange: 5.0

# Scan matching tuned for the clean simulated lidar and a compact indoor map.
sigma: 0.03
kernelSize: 1
lstep: 0.02
astep: 0.02
iterations: 12
lsigma: 0.05
ogain: 4.0
lskip: 0
minimumScore: 80

# Gazebo odometry is stable; lower noise keeps repeated patrol laps aligned
# while leaving scan matching enough freedom to correct wheel-contact drift.
srr: 0.015
srt: 0.015
str: 0.015
stt: 0.015

# Map update thresholds. Low thresholds make the map update frequently during slow autonomous patrol.
linearUpdate: 0.06
angularUpdate: 0.05
temporalUpdate: 0.3
resampleThreshold: 0.5
particles: 80

# Map bounds, meters. Covers the whole 5 m x 4 m arena plus margin.
xmin: -1.0
ymin: -4.5
xmax: 6.0
ymax: 1.0
delta: 0.02

# Likelihood-field sampling parameters.
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005

# TF publication.
transform_publish_period: 0.05
occ_thresh: 0.25
