# slam_toolbox online mapping parameters tuned for the 5 m x 4 m RAICOM
# Gazebo arena. The launch file supplies the frame and scan-topic values so the
# same file can be reused if the frame names are changed at launch time.

# Solver plugin params.
solver_plugin: solver_plugins::CeresSolver
ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
ceres_preconditioner: SCHUR_JACOBI
ceres_trust_strategy: LEVENBERG_MARQUARDT
ceres_dogleg_type: TRADITIONAL_DOGLEG
ceres_loss_function: None

# ROS parameters.
odom_frame: odom
map_frame: map
base_frame: base_footprint
scan_topic: /scan_filtered
mode: mapping
debug_logging: false
throttle_scans: 1
transform_publish_period: 0.03
map_update_interval: 0.8
resolution: 0.02
max_laser_range: 4.2
minimum_time_interval: 0.15
transform_timeout: 0.3
tf_buffer_duration: 30.0
stack_size_to_use: 40000000
enable_interactive_mode: true

# General mapping parameters.
# In this Gazebo task the odometry is deterministic. Disabling scan matching
# avoids a slam_toolbox/Karto probability-search crash while still producing a
# stable high-resolution occupancy map from /odom + /scan_filtered.
use_scan_matching: false
use_scan_barycenter: false
minimum_travel_distance: 0.06
minimum_travel_heading: 0.05
scan_buffer_size: 10
scan_buffer_maximum_scan_distance: 4.5
link_match_minimum_response_fine: 0.35
link_scan_maximum_distance: 0.8
loop_search_maximum_distance: 2.0
do_loop_closing: false
loop_match_minimum_chain_size: 10
loop_match_maximum_variance_coarse: 2.0
loop_match_minimum_response_coarse: 0.30
loop_match_minimum_response_fine: 0.40

# Correlation parameters.
correlation_search_space_dimension: 0.25
correlation_search_space_resolution: 0.01
correlation_search_space_smear_deviation: 0.05

# Loop closure search parameters.
loop_search_space_dimension: 4.0
loop_search_space_resolution: 0.05
loop_search_space_smear_deviation: 0.03

# Scan matcher parameters.
distance_variance_penalty: 0.8
angle_variance_penalty: 1.2
fine_search_angle_offset: 0.00349
coarse_search_angle_offset: 0.349
coarse_angle_resolution: 0.0349
minimum_angle_penalty: 0.9
minimum_distance_penalty: 0.5
use_response_expansion: true
